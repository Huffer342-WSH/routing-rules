    interval: 300

  - name: '♻️🇺🇸美国-定量自动'
    <<: *auto
    filter: (?i)^\[定量・[^\]]+\] .*(?:美国|美國|States|United States|🇺🇸|(?<![A-Za-z])US(?![A-Za-z]))
    interval: 300

  - name: '节点组-🇭🇰香港'
    <<: *select
    proxies:
