proxy-providers:
  按月机场A:
    type: http
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent: ["clash.meta"]
    exclude-filter: '剩余|套餐|网址|客服|过滤|时间|境外'
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
    url: "https://example.com/monthly-subscription" # 填入订阅URL
    override:
      additional-prefix: "[按月・机场A] " # 修改名字（保留按月/定量）
      # 按原始节点名补国旗；已有任意国旗则保留，机场前缀最后添加。
      proxy-name: &flag-renames
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:美国|美國|States|United States|🇺🇸|(?<![A-Za-z])US(?![A-Za-z]))).+'
          target: '🇺🇸 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:香港|Hong|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z]))).+'
          target: '🇭🇰 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:台湾|台灣|Taiwan|Taipei|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z]))).+'
          target: '🇹🇼 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:日本|Japan|Tokyo|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z]))).+'
          target: '🇯🇵 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:新加坡|Singapore|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z]))).+'
          target: '🇸🇬 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:韩国|韓國|Korea|Seoul|🇰🇷|(?<![A-Za-z])KR(?![A-Za-z]))).+'
          target: '🇰🇷 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:英国|英國|Kingdom|Britain|🇬🇧|(?<![A-Za-z])(?:UK|GB)(?![A-Za-z]))).+'
          target: '🇬🇧 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:法国|法國|France|Paris|🇫🇷|(?<![A-Za-z])FR(?![A-Za-z]))).+'
          target: '🇫🇷 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:德国|德國|Germany|Frankfurt|🇩🇪|(?<![A-Za-z])DE(?![A-Za-z]))).+'
          target: '🇩🇪 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:澳大利亚|澳大利亞|Australia|Sydney|🇦🇺|(?<![A-Za-z])AU(?![A-Za-z]))).+'
          target: '🇦🇺 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:加拿大|Canada|Toronto|🇨🇦|(?<![A-Za-z])CA(?![A-Za-z]))).+'
          target: '🇨🇦 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:土耳其|Turkey|Türkiye|Istanbul|🇹🇷|(?<![A-Za-z])TR(?![A-Za-z]))).+'
          target: '🇹🇷 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:阿根廷|Argentina|🇦🇷|(?<![A-Za-z])AR(?![A-Za-z]))).+'
          target: '🇦🇷 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:印度(?!尼西亚|尼西亞)|India(?!nesia)|🇮🇳|(?<![A-Za-z])IN(?![A-Za-z]))).+'
          target: '🇮🇳 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:越南|Vietnam|🇻🇳|(?<![A-Za-z])VN(?![A-Za-z]))).+'
          target: '🇻🇳 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:俄罗斯|俄羅斯|Russia|Moscow|🇷🇺|(?<![A-Za-z])RU(?![A-Za-z]))).+'
          target: '🇷🇺 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:荷兰|荷蘭|Netherlands|Amsterdam|🇳🇱|(?<![A-Za-z])NL(?![A-Za-z]))).+'
          target: '🇳🇱 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:尼日利亚|尼日利亞|Nigeria|Lagos|🇳🇬|(?<![A-Za-z])NG(?![A-Za-z]))).+'
          target: '🇳🇬 $0'
        - pattern: '(?i)^(?!.*[🇦-🇿])(?=.*(?:马其顿|馬其頓|Macedonia|🇲🇰|(?<![A-Za-z])MK(?![A-Za-z]))).+'
          target: '🇲🇰 $0'
  定量机场B:
    type: http
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent: ["clash.meta"]
    exclude-filter: '剩余|套餐|网址|客服|过滤|时间|境外'
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
    url: "https://example.com/quota-subscription"
    override:
      additional-prefix: "[定量・机场B] "
      # 复用首个机场定义的国旗规则；新增机场也使用此引用。
      proxy-name: *flag-renames

# Mihomo 原生 provider 模板；无需 JS / Sub-Store。
# 只修改 proxy-providers：复制机场块，填写 URL 和唯一前缀。
# 前缀必须为 "[按月・机场名] " 或 "[定量・机场名] "（末尾空格也保留）。
# 机场名不要包含 ]；地区匹配只检查前缀后的原始节点名。
# 默认按月，不自动切换定量池；健康检查仍可能产生少量定量流量。
# 地区为空时 REJECT，不自动直连。
# 订阅须返回 Mihomo 支持的节点内容；User-Agent 用于请求 Clash 格式。
# 完整使用说明和验证范围见 docs/mihomo-provider-template.md。

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
tcp-concurrent: true
geodata-mode: true
find-process-mode: strict
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 443
    TLS:
      ports:
      - 443
  skip-domain:
  - +.push.apple.com
  skip-dst-address:
  - 91.105.192.0/23
  - 91.108.4.0/22
  - 91.108.8.0/21
  - 91.108.16.0/21
  - 91.108.56.0/22
  - 95.161.64.0/20
  - 149.154.160.0/20
  - 185.76.151.0/24
  - 2001:67c:4e8::/48
  - 2001:b28:f23c::/47
  - 2001:b28:f23f::/48
  - 2a0a:f280:203::/48
dns:
  enable: true
  ipv6: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*'
  - +.lan
  - +.local
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://d.atri.ink/dns-query
  proxy-server-nameserver-policy:
    +.ctcxianyu.com:
    - https://38.76.213.238:8080/dns-query
    - https://sublol.iotechn.com:10086/dns-query
    +.525536.xyz:
    - https://38.76.213.238:8080/dns-query
    - https://sublol.iotechn.com:10086/dns-query
  nameserver-policy:
    geosite:gfw:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://d.atri.ink/dns-query#默认代理
  nameserver:
  - system
  - 223.5.5.5
  fallback-lazy-query: true
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    - 127.0.0.1/32
  fallback:
  - https://cloudflare-dns.com/dns-query#默认代理
  - https://d.atri.ink/dns-query
  - https://38.76.213.238:8080/dns-query

# 共用配置：YAML 锚点仅用于复用，不执行脚本。
x-select: &select
  type: select
  include-all-providers: true
  empty-fallback: REJECT

x-auto: &auto
  type: url-test
  include-all-providers: true
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 50
  lazy: true
  empty-fallback: REJECT
  # 高倍率仍能手选；自动组/负载均衡排除 >1 倍（常见 倍/x/X 命名）。
  exclude-filter: '(?<![\d.])(?:0*(?:[2-9]\d*|1\d+)(?:\.\d*)?|0*1\.0*[1-9]\d*)\s*[倍xX]|[倍xX]\s*(?:0*(?:[2-9]\d*|1\d+)(?:\.\d*)?|0*1\.0*[1-9]\d*)(?![\d.])'

proxy-groups:
  - name: '默认代理'
